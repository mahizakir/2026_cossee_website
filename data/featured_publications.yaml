- title: "Declining environmental predictability erodes reproduction in a tropical seabird"
  authors: "Santiago Ortega, Cristina Rodríguez, Ayumi Mizuno, Laura Arroyo, Hugh Drummond, and Shinichi Nakagawa"
  journal: "Nature Climate Change"
  published: "November 13, 2026"
  citation: "Nature Climate Change (2026)"
  doi: "10.1038/s41558-026-02795-7"
  url: "https://www.nature.com/articles/s41558-026-02795-7"
  image: "https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41558-026-02795-7/MediaObjects/41558_2026_2795_Fig1_HTML.png"
  image_alt: "Conceptual figure linking phytoplankton bloom predictability, breeding synchrony and reproductive success in blue-footed boobies"
  image_position: "50% 0%"
  summary: "Two decades of blue-footed booby breeding data show that phytoplankton blooms became less predictable from year to year without shifting on average, while breeding synchrony and nest success declined."

- title: "Mate choice copying in non-human animals: an update of two meta-analyses"
  authors: "Eduardo S. A. Santos, Aleksandra Milenović, Aneta Arct, Anna Lenz, Ayumi Mizuno, and colleagues"
  journal: "Biology Open"
  published: "October 20, 2026"
  citation: "Biology Open 15(10): bio062878"
  doi: "10.1242/bio.062878"
  url: "https://doi.org/10.1242/bio.062878"
  image: "https://cdn.ncbi.nlm.nih.gov/pmc/blobs/3283/13730131/38353168ef2b/biolopen-15-062878-g2.webp"
  image_alt: "Phylogenetic tree of the species added in the mate choice copying update"
  summary: "A multilingual, grey-literature-inclusive update of two meta-analyses finds that animals do copy others' mate choices, but the effect is smaller, more variable and more sensitive to publication bias than earlier estimates suggested."

- title: "A New Effect Size for Meta-Analysis of Magnitude: lnM"
  authors: "Shinichi Nakagawa, Ayumi Mizuno, Coralie Williams, Malgorzata Lagisz, Rose E. O'Dea, and colleagues"
  journal: "Ecology Letters"
  published: "September 3, 2026"
  citation: "Ecology Letters 29(9): e70428"
  doi: "10.1111/ele.70428"
  url: "https://doi.org/10.1111/ele.70428"
  image: "https://cdn.ncbi.nlm.nih.gov/pmc/blobs/e799/13542630/4bebda71e98d/ELE-29-0-g006.webp"
  image_alt: "Funnel plot panels from the lnM paper comparing signed, absolute and lnM effect sizes"
  summary: "Introduces lnM, a log-ratio effect size for the magnitude of difference between two groups, which avoids the upward bias of taking absolute values and works with standard multilevel meta-analysis and meta-regression."

- title: "MATES: a tool for appraising the completeness with which a meta-analysis has been reported"
  authors: "Kyle Morrison, Patrice Pottier, Pietro Pollo, Lorenzo Ricolfi, Coralie Williams, and colleagues"
  journal: "Environment International"
  published: "January 2026"
  citation: "Environment International 207: 109935"
  doi: "10.1016/j.envint.2025.109935"
  url: "https://doi.org/10.1016/j.envint.2025.109935"
  image: "https://ars.els-cdn.com/content/image/1-s2.0-S0160412025006865-gr3.jpg"
  image_alt: "Flowchart of the steps for using MATES to appraise a meta-analysis"
  summary: "Introduces MATES, a 14-item tool for appraising how completely an environmental-science meta-analysis has been reported, developed through a Delphi process with experts and editors and shown to be repeatable across 50 meta-analyses."
